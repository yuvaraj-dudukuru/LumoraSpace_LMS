<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('goal-form');
      const continueBtn = document.getElementById('continue-btn');
      const radios = form.querySelectorAll('input[type="radio"]');

      // Update styling and button state based on selection
      function updateSelectionState() {
        let isSelected = false;
        radios.forEach(radio => {
          const label = radio.closest('label');
          if (radio.checked) {
            isSelected = true;
            label.classList.add('border-primary', 'bg-primary-fixed-dim');
            label.classList.remove('border-surface-container', 'bg-surface-container');
            
            // Trigger a subtle pulse animation on selection
            label.animate([
              { transform: 'scale(1)' },
              { transform: 'scale(1.02)' },
              { transform: 'scale(1)' }
            ], {
              duration: 200,
              easing: 'ease-in-out'
            });

          } else {
            label.classList.remove('border-primary', 'bg-primary-fixed-dim');
            label.classList.add('border-surface-container', 'bg-surface-container');
          }
        });
        
        continueBtn.disabled = !isSelected;
      }

      radios.forEach(radio => {
        radio.addEventListener('change', updateSelectionState);
      });

      // Handle continue button click (simulated)
      continueBtn.addEventListener('click', () => {
        if (!continueBtn.disabled) {
          const selectedValue = form.querySelector('input[name="goal"]:checked').value;
          console.log(`Proceeding to Step 3 with goal: ${selectedValue}`);
          // Add loading state to button
          continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Processing...';
          continueBtn.disabled = true;
          
          setTimeout(() => {
             continueBtn.innerHTML = 'Continue <span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
             continueBtn.disabled = false;
          }, 1000);
        }
      });
    });
  </script>
