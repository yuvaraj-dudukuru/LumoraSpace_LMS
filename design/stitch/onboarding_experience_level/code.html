<script>
    document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.experience-btn');
        const completeBtn = document.getElementById('complete-setup-btn');
        let selectedValue = null;

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                buttons.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary/5');
                    b.classList.add('border-outline-variant');
                    const checkContainer = b.querySelector('.rounded-full');
                    checkContainer.classList.remove('border-primary', 'bg-primary/10');
                    checkContainer.classList.add('border-outline-variant');
                    const checkIcon = b.querySelector('.check-icon');
                    checkIcon.classList.remove('opacity-100', 'scale-100');
                    checkIcon.classList.add('opacity-0', 'scale-50');
                });

                // Set active
                btn.classList.add('border-primary', 'bg-primary/5');
                btn.classList.remove('border-outline-variant');
                
                const checkContainer = btn.querySelector('.rounded-full');
                checkContainer.classList.add('border-primary', 'bg-primary/10');
                checkContainer.classList.remove('border-outline-variant');
                
                const checkIcon = btn.querySelector('.check-icon');
                checkIcon.classList.add('opacity-100', 'scale-100');
                checkIcon.classList.remove('opacity-0', 'scale-50');

                selectedValue = btn.dataset.value;

                // Enable CTA
                completeBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
            });
        });
    });
