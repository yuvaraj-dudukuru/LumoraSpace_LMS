  </head><body class="bg-background font-body-md text-on-background min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-11 h-11 flex items-center justify-center text-on-surface hover:bg-surface-variant/20 rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><h1 class="text-title-lg font-title-lg text-on-surface">Settings</h1></div></header><main class="relative w-full pt-16 pb-safe bg-background"><div class="flex flex-col w-full h-full relative">
<!-- Settings Section Selector -->
<div class="px-margin-mobile py-lg">
<label class="font-label-md text-on-surface-variant block mb-sm">Settings Section</label>
<div class="relative w-full">
<select class="w-full appearance-none bg-surface-container text-on-surface font-body-md py-3 px-4 pr-12 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-shadow">
<option selected="" value="general">General</option>
<option value="security">Security</option>
<option value="billing">Billing</option>
<option value="notifications">Notifications</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Divider -->
<div class="w-full h-px bg-surface-variant my-xs"></div>
<!-- Settings Form Content -->
<div class="flex-1 px-margin-mobile py-lg pb-3xl space-y-xl overflow-y-auto">
<!-- Platform Name -->
<div>
<label class="font-label-md text-on-surface block mb-sm" for="platformName">Platform Name</label>
<input class="w-full bg-surface-container text-on-surface font-body-md py-3 px-4 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-shadow placeholder:text-on-surface-variant/50" id="platformName" placeholder="Enter platform name" type="text" value="LumoraSpace Alpha"/>
<p class="font-label-sm text-on-surface-variant mt-xs">This name will be visible to all workspace members.</p>
</div>
<!-- Support Email -->
<div>
<label class="font-label-md text-on-surface block mb-sm" for="supportEmail">Support Email</label>
<input class="w-full bg-surface-container text-on-surface font-body-md py-3 px-4 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-shadow placeholder:text-on-surface-variant/50" id="supportEmail" placeholder="Enter support email" type="email" value="admin@lumoraspace.dev"/>
</div>
<!-- Timezone -->
<div>
<label class="font-label-md text-on-surface block mb-sm" for="timezone">System Timezone</label>
<div class="relative w-full">
<select class="w-full appearance-none bg-surface-container text-on-surface font-body-md py-3 px-4 pr-12 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-shadow" id="timezone">
<option value="UTC">UTC (Coordinated Universal Time)</option>
<option selected="" value="PST">PST (Pacific Standard Time)</option>
<option value="EST">EST (Eastern Standard Time)</option>
<option value="CET">CET (Central European Time)</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">schedule</span>
</div>
</div>
</div>
<!-- Language -->
<div>
<label class="font-label-md text-on-surface block mb-sm" for="language">Default Language</label>
<div class="relative w-full">
<select class="w-full appearance-none bg-surface-container text-on-surface font-body-md py-3 px-4 pr-12 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-shadow" id="language">
<option selected="" value="en-US">English (US)</option>
<option value="en-GB">English (UK)</option>
<option value="fr-FR">Français</option>
<option value="es-ES">Español</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">language</span>
</div>
</div>
</div>
<!-- Advanced Toggles -->
<div class="pt-md">
<h3 class="font-title-lg text-on-surface mb-lg">Advanced Preferences</h3>
<div class="flex items-center justify-between py-md">
<div>
<span class="block font-body-md text-on-surface font-medium">Require 2FA for Admins</span>
<span class="block font-label-sm text-on-surface-variant mt-xs">Mandatory two-factor authentication for all administrative accounts.</span>
</div>
<!-- Toggle Switch -->
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none" role="switch">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 translate-x-5 transform rounded-full bg-on-primary shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<div class="flex items-center justify-between py-md">
<div>
<span class="block font-body-md text-on-surface font-medium">Experimental Features</span>
<span class="block font-label-sm text-on-surface-variant mt-xs">Opt-in to beta features before general release.</span>
</div>
<!-- Toggle Switch (Off state) -->
<button aria-checked="false" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-surface-variant transition-colors duration-200 ease-in-out focus:outline-none" role="switch">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 translate-x-0 transform rounded-full bg-surface shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
</div>
</div>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-md pb-safe px-margin-mobile py-md shadow-[0_-4px_20px_rgba(13,11,16,0.05)] z-40">
<button class="w-full bg-primary text-on-primary font-label-md py-4 rounded-full flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">save</span>
      Save Changes
    </button>
</div>
<!-- Spacer to prevent content hiding behind fixed bar -->
<div class="h-24 w-full opacity-0 pointer-events-none"></div>
</div></main></body></html>
