<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Demo College Client - Sign In</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              300: '#93cbfb',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              accent: '#a5c8ed',
              btn: '#9ec2e6'
            }
          },
          boxShadow: {
            'card': '0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.02)',
            'pill': '0 2px 5px rgba(0, 0, 0, 0.06)'
          }
        }
      }
    }
  </script>
<!-- Custom styles for typography and inputs -->
<style data-purpose="custom-overrides">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input::placeholder {
      color: #94a3b8;
      font-size: 0.925rem;
    }
  </style>
</head>
<body class="bg-[#f2f5f9] min-h-screen flex items-center justify-center p-3 sm:p-6 text-slate-800 antialiased selection:bg-blue-100">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-[430px] mx-auto">
<!-- BEGIN: LoginCard -->
<div class="bg-white rounded-3xl shadow-card border border-slate-100/80 px-7 pt-8 pb-7 flex flex-col items-center">
<!-- BEGIN: CollegeLogo -->
<!-- College seal emblem icon with border and inner badge -->
<div class="w-16 h-16 rounded-2xl border border-slate-200/90 flex items-center justify-center p-1.5 shadow-sm bg-white mb-5">
<div class="w-full h-full rounded-full border border-slate-200 flex flex-col items-center justify-center p-1 relative overflow-hidden">
<!-- Graduation Cap Icon and Ring Symbol -->
<svg class="w-6 h-6 text-[#1e3a5f]" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"></path>
</svg>
<span class="text-[5.5px] font-bold text-[#1e3a5f] tracking-tight uppercase mt-0.5 leading-none">Demo College</span>
</div>
</div>
<!-- END: CollegeLogo -->
<!-- BEGIN: HeaderTitles -->
<h1 class="text-[1.55rem] font-bold text-slate-900 tracking-tight text-center mb-1">Demo College Client
      </h1>
<p class="text-[0.93rem] text-slate-500 font-normal text-center mb-6">
        Sign in with your college credentials
      </p>
<!-- END: HeaderTitles -->
<!-- BEGIN: RoleSwitchTabs -->
<!-- Interactive segmented pill toggle: Student vs Admin & Faculty -->
<div class="w-full bg-[#f1f4f9] p-1 rounded-xl flex items-center mb-6" data-purpose="role-selector">
<button class="flex-1 py-2.5 text-center text-[0.92rem] font-bold rounded-[10px] transition-all duration-200 bg-white text-slate-900 shadow-pill" id="tab-student" onclick="selectRole('student')" type="button">
          Student
        </button>
<button class="flex-1 py-2.5 text-center text-[0.92rem] font-medium rounded-[10px] transition-all duration-200 text-slate-500 hover:text-slate-700" id="tab-admin" onclick="selectRole('admin')" type="button">
          Admin &amp; Faculty
        </button>
</div>
<!-- END: RoleSwitchTabs -->
<!-- BEGIN: LoginForm -->
<form class="w-full space-y-4" onsubmit="event.preventDefault();">
<!-- BEGIN: IdentifierField -->
<div>
<label class="block text-[0.925rem] font-semibold text-slate-900 mb-1.5" for="identifier-input" id="identifier-label">
            Roll Number
          </label>
<div class="relative flex items-center">
<!-- Left icon (ID/User Profile) -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 text-slate-400 stroke-[1.8]" fill="none" id="identifier-icon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-[#fbfcfe] border border-slate-200/90 rounded-xl text-slate-800 text-[0.93rem] focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition" id="identifier-input" name="identifier" placeholder="Enter Roll Number" required="" type="text">
</div>
</div>
<!-- END: IdentifierField -->
<!-- BEGIN: PasswordField -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="text-[0.925rem] font-semibold text-slate-900" for="password-input">
              Password
            </label>
<a class="text-[0.85rem] font-medium text-blue-600 hover:text-blue-700 transition" href="#">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<!-- Left Lock Icon -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 text-slate-400 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Password Input -->
<input class="w-full pl-11 pr-11 py-3 bg-[#f0f4fa] border-none rounded-xl text-slate-800 text-[0.93rem] tracking-wider focus:outline-none focus:ring-2 focus:ring-blue-400 transition" id="password-input" name="password" placeholder="••••••" required="" type="password">
<!-- Right Eye Toggle Icon -->
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" id="eye-icon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- END: PasswordField -->
<!-- BEGIN: SubmitButton -->
<div class="pt-2">
<button class="w-full py-3 px-4 bg-[#9ec3e8] hover:bg-[#8eb8e2] active:bg-[#7eaedc] text-white font-semibold rounded-xl text-[0.98rem] shadow-sm transition duration-150 ease-in-out" type="submit">
            Sign In
          </button>
</div>
<!-- END: SubmitButton -->
</form>
<!-- END: LoginForm -->
<!-- Divider -->
<div class="w-full border-t border-slate-100 my-5"></div>
<!-- BEGIN: FooterNote -->
<div class="text-center text-[0.88rem] text-slate-600">
        College Code: <span class="font-bold text-slate-900">DCC</span>
</div>
<!-- END: FooterNote -->
</div>
<!-- END: LoginCard -->
</main>
<!-- END: MainContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="ui-interactions">
    // Switch between Student and Admin tabs
    function selectRole(role) {
      const studentTab = document.getElementById('tab-student');
      const adminTab = document.getElementById('tab-admin');
      const label = document.getElementById('identifier-label');
      const input = document.getElementById('identifier-input');

      if (role === 'student') {
        studentTab.className = 'flex-1 py-2.5 text-center text-[0.92rem] font-bold rounded-[10px] transition-all duration-200 bg-white text-slate-900 shadow-pill';
        adminTab.className = 'flex-1 py-2.5 text-center text-[0.92rem] font-medium rounded-[10px] transition-all duration-200 text-slate-500 hover:text-slate-700';
        label.innerText = 'Roll Number';
        input.placeholder = 'Enter Roll Number';
      } else {
        adminTab.className = 'flex-1 py-2.5 text-center text-[0.92rem] font-bold rounded-[10px] transition-all duration-200 bg-white text-slate-900 shadow-pill';
        studentTab.className = 'flex-1 py-2.5 text-center text-[0.92rem] font-medium rounded-[10px] transition-all duration-200 text-slate-500 hover:text-slate-700';
        label.innerText = 'Faculty / Staff ID';
        input.placeholder = 'Enter Employee ID';
      }
    }

    // Toggle password visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password-input');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }
  </script>
<!-- END: InteractiveScripts -->


</body></html>
