<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Demo College Client - Login</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              title: '#0b192c',
              subtext: '#64748b',
              accent: '#3b82f6',
              btn: '#9ec4ea',
              btnHover: '#86b4e3',
              inputBg: '#f8fafc',
              inputBorder: '#e2e8f0',
              tabBg: '#edf2f7'
            }
          },
          boxShadow: {
            'card': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.04)',
            'pill': '0 2px 6px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Form & Layout Tweaks -->
<style data-purpose="custom-layout">
    body {
      background-color: #f1f4f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tap-highlight-transparent {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">
<!-- BEGIN: MainCardContainer -->
<main class="w-full max-w-[440px] bg-white rounded-[28px] shadow-card px-7 py-9 sm:px-8 sm:py-10 border border-slate-100/80 transition-all">
<!-- BEGIN: HeaderSection -->
<header class="flex flex-col items-center text-center">
<!-- College Emblem / Logo Container -->
<div class="w-16 h-16 rounded-2xl bg-white border border-slate-200/90 shadow-sm flex items-center justify-center p-2 mb-5" data-purpose="college-logo-wrapper">
<svg aria-label="Demo College Logo" class="w-11 h-11 text-[#1e3a8a]" fill="none" viewbox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<!-- Circular Laurel / Frame -->
<circle cx="32" cy="32" r="29" stroke="#1e3a8a" stroke-dasharray="2 1.5" stroke-width="1.8"></circle>
<circle cx="32" cy="32" r="26.5" stroke="#1e3a8a" stroke-width="0.75"></circle>
<!-- Graduation Cap Icon -->
<path d="M32 15L47 22.5L32 30L17 22.5L32 15Z" fill="#1e3a8a"></path>
<path d="M42 25.5V33.5C42 37 37.5 40 32 40C26.5 40 22 37 22 33.5V25.5" stroke="#1e3a8a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path>
<path d="M47 22.5V32.5" stroke="#1e3a8a" stroke-linecap="round" stroke-width="1.5"></path>
<circle cx="47" cy="33.5" fill="#1e3a8a" r="1.2"></circle>
<!-- Star/Ribbon Accent -->
<path d="M28 44.5L32 42.5L36 44.5L35 40.5L38 38L33.8 37.6L32 34L30.2 37.6L26 38L29 40.5L28 44.5Z" fill="#2563eb" transform="scale(0.55) translate(26, 26)"></path>
<!-- Tiny Banner Text Effect -->
<path d="M22 47.5C27 46.2 37 46.2 42 47.5" stroke="#1e3a8a" stroke-linecap="round" stroke-width="1.2"></path>
</svg>
</div>
<!-- Main Title -->
<h1 class="text-[23px] sm:text-[25px] font-bold text-[#09152b] tracking-[-0.015em] mb-1.5">
        Demo College Client
      </h1>
<!-- Subtitle -->
<p class="text-[13.5px] text-[#6b7c93] font-normal tracking-tight">
        Sign in with your college credentials
      </p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: SegmentedControlSwitch -->
<!-- Tab Toggle: Student vs Admin & Faculty -->
<div aria-label="User Category" class="mt-6 mb-6 p-1 bg-[#edf2f7] rounded-xl flex items-center relative text-sm font-medium" role="tablist">
<!-- Student Option Button -->
<button aria-selected="false" class="flex-1 py-2.5 text-center text-[#64748b] font-medium transition-all duration-200 rounded-[10px] tap-highlight-transparent hover:text-slate-900" id="tab-student" onclick="switchTab('student')" role="tab">
        Student
      </button>
<!-- Admin & Faculty Option Button (Default Selected) -->
<button aria-selected="true" class="flex-1 py-2.5 text-center bg-white text-[#0f172a] font-bold shadow-pill transition-all duration-200 rounded-[10px] tap-highlight-transparent" id="tab-admin" onclick="switchTab('admin')" role="tab">
        Admin &amp; Faculty
      </button>
</div>
<!-- END: SegmentedControlSwitch -->
<!-- BEGIN: LoginForm -->
<form class="space-y-4" onsubmit="handleLogin(event)">
<!-- Email Field -->
<div>
<label class="block text-[13.5px] font-bold text-[#0f172a] mb-2 tracking-tight" for="email">
          Email
        </label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<!-- Mail Icon -->
<svg class="w-5 h-5 stroke-[1.6]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full pl-11 pr-3.5 py-3 text-[13.5px] bg-[#f8fafc] text-slate-900 placeholder-slate-400 rounded-xl border border-slate-200/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition duration-150 ease-in-out" id="email" name="email" placeholder="Enter your organizational email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="text-[13.5px] font-bold text-[#0f172a] tracking-tight" for="password">
            Password
          </label>
<a class="text-[13px] font-semibold text-[#3b82f6] hover:text-blue-700 transition duration-150" href="#">
            Forgot password?
          </a>
</div>
<div class="relative flex items-center">
<!-- Lock Icon -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 stroke-[1.6]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="10" rx="2" stroke-linecap="round" stroke-linejoin="round" width="14" x="5" y="11"></rect>
<path d="M8 11V7a4 4 0 018 0v4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Password Input -->
<input class="block w-full pl-11 pr-11 py-3 text-[13.5px] bg-[#edf3fc] text-slate-900 tracking-wider placeholder-slate-400 rounded-xl border border-blue-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition duration-150 ease-in-out font-medium" id="password" name="password" placeholder="Enter your password" required="" type="password" value="DemoPassword123"/>
<!-- Eye Toggle Button -->
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<svg class="w-5 h-5 stroke-[1.6]" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Submit Action Button -->
<div class="pt-2.5">
<button class="w-full py-3.5 px-4 bg-[#9ec4ea] hover:bg-[#8bbceb] active:bg-[#7cb2e6] text-white font-semibold text-[15px] rounded-xl shadow-sm transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#9ec4ea]" type="submit">
          Sign In
        </button>
</div>
</form>
<!-- END: LoginForm -->
<!-- Separator Line -->
<div class="mt-7 pt-5 border-t border-slate-100 flex justify-center items-center">
<!-- BEGIN: FooterDetails -->
<p class="text-[13px] text-[#64748b]">
        College Code: <span class="font-bold text-[#334155]">DCC</span>
</p>
<!-- END: FooterDetails -->
</div>
</main>
<!-- END: MainCardContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="tab-and-form-interactivity">
    // Switch between Student and Admin & Faculty tabs
    function switchTab(role) {
      const studentTab = document.getElementById('tab-student');
      const adminTab = document.getElementById('tab-admin');
      const emailInput = document.getElementById('email');

      if (role === 'student') {
        studentTab.className = "flex-1 py-2.5 text-center bg-white text-[#0f172a] font-bold shadow-pill transition-all duration-200 rounded-[10px] tap-highlight-transparent";
        studentTab.setAttribute('aria-selected', 'true');
        
        adminTab.className = "flex-1 py-2.5 text-center text-[#64748b] font-medium transition-all duration-200 rounded-[10px] tap-highlight-transparent hover:text-slate-900";
        adminTab.setAttribute('aria-selected', 'false');

        emailInput.placeholder = "Enter your student ID or email";
      } else {
        adminTab.className = "flex-1 py-2.5 text-center bg-white text-[#0f172a] font-bold shadow-pill transition-all duration-200 rounded-[10px] tap-highlight-transparent";
        adminTab.setAttribute('aria-selected', 'true');
        
        studentTab.className = "flex-1 py-2.5 text-center text-[#64748b] font-medium transition-all duration-200 rounded-[10px] tap-highlight-transparent hover:text-slate-900";
        studentTab.setAttribute('aria-selected', 'false');

        emailInput.placeholder = "Enter your organizational email";
      }
    }

    // Toggle password visibility state
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }

    // Form submission mock handler
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Authenticating credentials for: ${email}`);
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
