<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Management - Demo College Client</title>
<!-- Tailwind CSS v3 CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    };
  </script>
<!-- Custom typography styles -->
<style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-[#f8faff] min-h-screen text-slate-800 antialiased flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="bg-white border-b border-slate-200/80 sticky top-0 z-30" data-purpose="primary-navigation-bar">
<div class="max-w-[1440px] mx-auto px-6 h-16 flex items-center justify-between">
<!-- Left side: Brand Logo & Title -->
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-full border border-blue-200/80 bg-blue-50/50 flex items-center justify-center p-1.5 shadow-sm">
<svg class="w-6 h-6 text-blue-900" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<!-- Academic graduation / crest icon -->
<path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
<path d="M6 12v5c3 3 9 3 12 0v-5"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="font-bold text-[15px] leading-tight text-slate-900 tracking-tight">Demo College Client</span>
<span class="text-[11px] font-medium text-blue-950/70 tracking-tight">Unified Learning &amp; Hiring Platform</span>
</div>
</div>
<!-- Center: Main Navigation Menu -->
<nav aria-label="Main Navigation" class="hidden md:flex items-center space-x-1 lg:space-x-3 text-[14px] font-medium text-slate-600">
<a class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-slate-600 hover:text-slate-900 transition-colors" href="#">
<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="7" rx="1" width="7" x="3" y="3"></rect>
<rect height="7" rx="1" width="7" x="14" y="3"></rect>
<rect height="7" rx="1" width="7" x="14" y="14"></rect>
<rect height="7" rx="1" width="7" x="3" y="14"></rect>
</svg>
<span>Dashboard</span>
</a>
<!-- Users dropdown -->
<button class="px-3 py-1.5 rounded-lg flex items-center gap-1 hover:text-slate-900 transition-colors" type="button">
<span>Users</span>
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Learning dropdown (Active State) -->
<button class="px-3 py-1.5 rounded-lg flex items-center gap-1 text-slate-900 font-semibold transition-colors" type="button">
<span>Learning</span>
<svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Placement dropdown -->
<button class="px-3 py-1.5 rounded-lg flex items-center gap-1 hover:text-slate-900 transition-colors" type="button">
<span>Placement</span>
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Resources dropdown -->
<button class="px-3 py-1.5 rounded-lg flex items-center gap-1 hover:text-slate-900 transition-colors" type="button">
<span>Resources</span>
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</nav>
<!-- Right side: Credits pill, Notification, Settings & User Avatar -->
<div class="flex items-center space-x-4">
<!-- AI Credit indicator badge -->
<div class="flex items-center bg-white border border-slate-200/90 rounded-full px-3.5 py-1.5 shadow-sm text-xs font-semibold text-slate-700">
<span class="w-2 h-2 rounded-full bg-blue-600 mr-2"></span>
<span>97 AI Credits</span>
</div>
<!-- Notification Bell Icon -->
<button class="p-1.5 text-slate-500 hover:text-slate-700 rounded-full hover:bg-slate-100 transition-colors" title="Notifications" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Settings Cog Icon -->
<button class="p-1.5 text-slate-500 hover:text-slate-700 rounded-full hover:bg-slate-100 transition-colors" title="Settings" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- User Profile Pill / Dropdown -->
<button class="flex items-center space-x-1 pl-1 py-0.5 pr-0.5 rounded-full hover:bg-slate-100 transition-colors" type="button">
<div class="w-8 h-8 rounded-full bg-[#2563eb] text-white flex items-center justify-center font-semibold text-sm shadow-sm">
            A
          </div>
<svg class="w-3.5 h-3.5 text-slate-400 ml-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 max-w-[1240px] w-full mx-auto px-4 sm:px-6 py-7 space-y-6" data-purpose="course-management-container">
<!-- Hero / Header Card with Search -->
<!-- BEGIN: HeaderCard -->
<section class="bg-white rounded-2xl border border-slate-200/70 p-6 md:p-8 shadow-[0_1px_3px_rgba(0,0,0,0.03)] relative overflow-hidden" data-purpose="page-hero-card">
<div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
<!-- Heading Info -->
<div>
<span class="text-[11px] font-bold tracking-wider text-blue-500 uppercase block mb-1">
            MANAGEMENT
          </span>
<h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
            Course Management
          </h1>
<p class="text-slate-500 text-[14px] mt-1.5 font-normal">
            Manage your courses and view shared courses
          </p>
</div>
<!-- Action Button: Create Course -->
<div class="flex-shrink-0 pt-0.5">
<button class="inline-flex items-center gap-1.5 px-4 py-2.5 bg-[#4285f4] hover:bg-blue-600 text-white text-sm font-semibold rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Create Course</span>
</button>
</div>
</div>
<!-- Search Input Bar -->
<div class="mt-6" data-purpose="course-search-bar">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200/90 rounded-lg text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Search courses by name..." type="text"/>
</div>
</div>
</section>
<!-- END: HeaderCard -->
<!-- Empty State Content Card -->
<!-- BEGIN: EmptyStateCard -->
<section class="bg-white rounded-2xl border border-slate-200/70 p-12 md:p-20 shadow-[0_1px_3px_rgba(0,0,0,0.03)] flex flex-col items-center justify-center text-center min-h-[360px]" data-purpose="empty-courses-state">
<!-- Open Book Empty State Icon -->
<div class="mb-4 text-slate-300">
<svg class="w-14 h-14 stroke-[1.4]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
<path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
</svg>
</div>
<!-- Empty State Texts -->
<h2 class="text-base md:text-lg font-bold text-slate-700 tracking-tight mb-1">
        No enrolled courses
      </h2>
<p class="text-xs md:text-sm text-slate-400 font-normal max-w-sm">
        Publish courses and share to see them here
      </p>
</section>
<!-- END: EmptyStateCard -->
</main>
<!-- END: MainContent -->
</body></html>
